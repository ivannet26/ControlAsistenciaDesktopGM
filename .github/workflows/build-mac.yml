name: Build macOS Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests python-dotenv reportlab xhtml2pdf openpyxl pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name="ControlAsistencia" --windowed --noconfirm main.py

      - name: Create DMG
        run: |
          hdiutil create -volname "ControlAsistencia" -srcfolder dist/ControlAsistencia.app -ov -format UDZO ControlAsistencia_Mac.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ControlAsistencia-Mac-Installer
          path: ControlAsistencia_Mac.dmg
